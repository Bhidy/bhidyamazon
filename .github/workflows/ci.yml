name: ci

# Quality gate + deploy: runs on every push to main and on PRs.
# PRs get tests only; pushes to main also deploy to Vercel production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # npm install (not ci) tolerates cross-platform optional-dep (@emnapi/*)
        # lockfile variance between the macOS dev machine and the Linux runner.
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # A page that typechecks can still fail to compile/prerender (RSC rules,
      # route exports). Catch it here, not at deploy time.
      - name: Build
        run: npm run build

  # Render-the-real-data gate: production build + server + real CSP, a clean
  # console, and the persistent watchlist surviving navigation.
  smoke-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build (production)
        run: npm run build

      - name: Smoke E2E
        run: npm run e2e

  # The HTML parsers are the system's most drift-prone code (selectors on markup
  # we don't control). The fixture suite locks their behavior.
  scraper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install --quiet beautifulsoup4 pytest

      - name: Parser tests
        run: python -m pytest scrapers/tests/ -q

  # Deploy to Vercel production on every push to main (not on PRs).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-gate, scraper-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: web

      - name: Build (production)
        run: npm run build
        working-directory: web

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel@54
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --cwd web
          vercel build --prod --token="$VERCEL_TOKEN" --cwd web
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --cwd web
