name: ci

# Institutional quality gate: typecheck + unit tests on every change to main.
# Runs against the Next.js app in web/. No build/deploy here — that lives in
# scrape-and-deploy.yml; this job exists purely to block regressions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        # npm install (not ci) tolerates cross-platform optional-dep (@emnapi/*)
        # lockfile variance between the macOS dev machine and the Linux runner.
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
