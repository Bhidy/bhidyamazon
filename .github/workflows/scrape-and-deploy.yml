name: scrape-and-deploy

# Fully-cloud, fully-automated daily refresh of the real amazon.eg data + redeploy.
# Datacenter/CI IPs get 503 from amazon.eg, so the scrape goes THROUGH Firecrawl
# (RASID_FETCH=firecrawl, ~1 credit/page → ~720/month, within the 1,000 free tier).

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC ≈ 08:17 Africa/Cairo, once daily
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write # allow the failure() step to open a tracking issue

concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install scraper deps
        run: pip install --quiet curl_cffi beautifulsoup4

      - name: Scrape amazon.eg (via Firecrawl)
        env:
          RASID_FETCH: firecrawl
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: python scrapers/run.py

      # Keywords are best-effort (autocomplete can be blocked from CI IPs) but the
      # failure must be VISIBLE — this used to be `|| echo`, which froze keywords
      # for days with no signal while the rest of the data refreshed.
      - name: Refresh demand keywords (best-effort, alerted)
        id: trends
        continue-on-error: true
        run: python scrapers/trends.py

      - name: Warn if keyword refresh failed (deduped issue)
        if: steps.trends.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create keywords-stale --force --color D93F0B \
            --description "Daily keyword refresh is failing" || true
          open=$(gh issue list --label keywords-stale --state open --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create \
              --title "Keyword refresh failing — keywords.json is going stale" \
              --label keywords-stale \
              --body "scrapers/trends.py failed on $(date -u +%FT%TZ) (run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          The main scrape still succeeds, so best-sellers stay fresh while keyword
          freshness drifts — the Demand Radar page shows the channel's own age.
          Close this issue once a run refreshes keywords.json again." \
            || echo "issue creation failed (non-blocking)"
          else
            echo "open keywords-stale issue already exists — not duplicating"
          fi

      # Schema gate: the refreshed JSON must satisfy web/src/lib/real-schema.ts
      # BEFORE it is committed. A drifted scraper output fails the run here (and
      # the failure step opens an issue) instead of landing in the repo and being
      # silently rejected at render time.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate refreshed data (schema gate)
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npx vitest run src/lib/__tests__/real-data-integrity.test.ts

      - name: Commit refreshed data (history)
        run: |
          git config user.name "rasid-bot"
          git config user.email "rasid-bot@users.noreply.github.com"
          git add web/src/data/real
          if git diff --staged --quiet; then
            echo "no data changes this run"
          else
            git commit -m "data: automated amazon.eg refresh $(date -u +%FT%TZ)"
            git push
          fi

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Pinned major: an unattended daily job must not absorb breaking CLI
          # changes the moment they ship. Bump deliberately.
          npm i -g vercel@54
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --cwd web
          vercel build --prod --token="$VERCEL_TOKEN" --cwd web
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --cwd web

      # Visibility: if any step above failed, open a tracking issue with the run URL.
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Daily scrape failed" \
            --body "The scheduled \`scrape-and-deploy\` workflow failed on $(date -u +%FT%TZ).

          **Run:** $RUN_URL
          **Commit:** ${{ github.sha }}
          **Trigger:** ${{ github.event_name }}

          Check the run logs for the failing step (scrape / commit / deploy)." \
          || echo "issue creation failed (non-blocking)"
